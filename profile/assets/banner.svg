<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Harshil Makhija, AI Systems Engineer</title>
  <desc id="d">Banner with the name Harshil Makhija, the title AI Systems Engineer, the line "Agents that ask before they act. Answers that show their work.", and three tags: LLM agents, RAG, Backend and Cloud. A glowing network of connected nodes sits on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a2e"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b3a5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="930" cy="110" r="190" fill="url(#glowV)"/>
  <circle cx="1090" cy="230" r="150" fill="url(#glowC)"/>

  <!-- connected-node motif -->
  <g stroke="url(#accent)" stroke-opacity="0.6" stroke-width="2" fill="none">
    <path d="M740 80 L860 140 L990 70 L1110 130"/>
    <path d="M860 140 L930 235 L1060 205 L1110 130"/>
    <path d="M740 80 L800 215 L930 235"/>
    <path d="M990 70 L1060 205"/>
    <path d="M860 140 L1060 205" stroke-dasharray="4 7"/>
  </g>
  <g stroke-width="2.5" fill="#0f0a2e">
    <circle cx="740" cy="80" r="10" stroke="#22d3ee"/>
    <circle cx="860" cy="140" r="14" stroke="#a78bfa"/>
    <circle cx="990" cy="70" r="10" stroke="#fbbf24"/>
    <circle cx="1110" cy="130" r="12" stroke="#f472b6"/>
    <circle cx="800" cy="215" r="9" stroke="#22d3ee"/>
    <circle cx="930" cy="235" r="11" stroke="#a78bfa"/>
    <circle cx="1060" cy="205" r="9" stroke="#fbbf24"/>
  </g>
  <g>
    <circle cx="860" cy="140" r="5" fill="#a78bfa"/>
    <circle cx="990" cy="70" r="4" fill="#fbbf24"/>
    <circle cx="1110" cy="130" r="5" fill="#f472b6"/>
    <circle cx="740" cy="80" r="4" fill="#22d3ee"/>
  </g>

  <!-- text -->
  <rect x="64" y="58" width="72" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Harshil Makhija</text>
  <text x="64" y="171" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="700" fill="url(#accent)">AI Systems Engineer</text>
  <text x="64" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#c4b5fd">Agents that ask before they act. Answers that show their work.</text>

  <!-- tags -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="236" width="124" height="32" rx="16" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.8"/>
    <text x="126" y="257" text-anchor="middle" fill="#67e8f9">LLM agents</text>
    <rect x="200" y="236" width="76" height="32" rx="16" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.8"/>
    <text x="238" y="257" text-anchor="middle" fill="#c4b5fd">RAG</text>
    <rect x="288" y="236" width="172" height="32" rx="16" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-opacity="0.8"/>
    <text x="374" y="257" text-anchor="middle" fill="#f9a8d4">Backend &amp; Cloud</text>
  </g>
</svg>
